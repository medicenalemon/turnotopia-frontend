<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Logo Test</title>
  <style>
    body { background: #0f172a; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 16px;
      background: white;
      padding: 40px;
      border-radius: 8px;
    }
    .logo-icon {
      position: relative;
      width: 64px;
      height: 64px;
    }
    .cyan-part {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 50%;
      background: #00CFE8;
    }
    .green-part {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 50%;
      height: 50%;
      background: #84FF00;
      border-bottom-left-radius: 100%;
    }
    .logo-text {
      font-size: 56px;
      font-weight: 800;
      letter-spacing: -2px;
      margin-top: -8px;
    }
    .text-cyan { color: #00CFE8; }
    .text-green { color: #84FF00; }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="logo-icon">
      <div class="cyan-part"></div>
      <div class="green-part"></div>
    </div>
    <div class="logo-text">
      <span class="text-cyan">turno</span><span class="text-green">topia</span>
    </div>
  </div>
</body>
</html>
